name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4"]
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7

      # Third-party dependency allowlist. Cheap, and failing here is cheap --
      # the same check gates the release, so a PR that adds an unapproved or
      # abandoned dependency finds out now rather than at tag time.
      # The allowlist is FETCHED, never vendored: one source, no copies to drift.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mbstring, dom, zip, pdo_sqlite

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      # Hermetic: in-memory SQLite, the sync queue and a scripted Prism
      # provider. No network and no provider key.
      - name: Run tests
        run: vendor/bin/pest --colors=always

      - name: Lint
        run: php tests/lint.php

      - name: Validate Composer manifest
        run: composer validate --strict

  # Rulesets require the literal "build" check. Keep the matrix labels and
  # require every step above.
  build:
    name: build
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all PHP checks
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
