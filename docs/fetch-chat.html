<!doctype html>
<!--
  A complete Charlotte chat on nothing but fetch. No framework, no build step,
  no socket. It proves the contract: POST a message, then long-poll the event
  log from a cursor.

  Serve it from your Laravel app behind the same session as the Charlotte
  routes, e.g. a Blade view with the CSRF token in the meta tag below:
      <meta name="csrf-token" content="{{ csrf_token() }}">
  and set data-session to a session id your controller opened.

  Security: every string from the server is written with textContent, never
  innerHTML. Agent text is untrusted.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="REPLACE_WITH_CSRF_TOKEN">
  <title>Charlotte: fetch-only chat</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; }
    #log { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; min-height: 18rem; }
    .msg { margin: 0 0 .75rem; white-space: pre-wrap; }
    .user { color: #1d4ed8; }
    .note { color: #555; font-size: 13px; }
    .proposal button { margin-right: .5rem; }
    form { display: flex; gap: .5rem; margin-top: 1rem; }
    input { flex: 1; padding: .5rem; }
  </style>
</head>
<body data-base="/charlotte" data-session="REPLACE_WITH_SESSION_ID">
  <h1>Build with Charlotte</h1>
  <p class="note" id="status">idle</p>
  <div id="log" aria-live="polite"></div>
  <form id="composer">
    <input id="text" autocomplete="off" placeholder="Build the landing page from the brief." aria-label="Message">
    <button>Send</button>
    <button type="button" id="stop">Stop</button>
  </form>

<script>
  const base = document.body.dataset.base;
  const session = document.body.dataset.session;
  const csrf = document.querySelector('meta[name="csrf-token"]').content;
  const log = document.getElementById('log');
  const bubbles = new Map(); // messageId -> element
  let cursor = 0;

  async function api(method, path, body) {
    const response = await fetch(`${base}/sessions/${session}${path}`, {
      method,
      credentials: 'same-origin',
      headers: { 'Accept': 'application/json', 'Content-Type': 'application/json', 'X-CSRF-TOKEN': csrf },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    const json = await response.json().catch(() => ({}));
    if (!response.ok) throw Object.assign(new Error(json.error?.code ?? String(response.status)), { status: response.status, body: json });
    return json;
  }

  function line(text, className = 'msg') {
    const p = document.createElement('p');
    p.className = className;
    p.textContent = text; // never innerHTML
    log.append(p);
    log.scrollTop = log.scrollHeight;
    return p;
  }

  function bubble(messageId, role) {
    if (!bubbles.has(messageId)) bubbles.set(messageId, line('', `msg ${role === 'user' ? 'user' : ''}`));
    return bubbles.get(messageId);
  }

  function proposal(data) {
    const box = line(`Charlotte proposes ${data.opCount} change(s). `, 'msg proposal');
    for (const [label, action] of [['Approve', 'accept'], ['Reject', 'reject']]) {
      const button = document.createElement('button');
      button.textContent = label;
      button.dataset.charlotteAction = action;
      button.onclick = () => api('POST', `/proposals/${data.proposalId}/${action}`, {}).then(() => box.remove(), (e) => line(`Could not ${action}: ${e.message}`, 'note'));
      box.append(button);
    }
  }

  // One event at a time, in seq order. Unknown types are ignored on purpose:
  // that is the forward-compatibility rule of the v1 envelope.
  function apply(event) {
    const d = event.data;
    switch (event.type) {
      case 'session.status': document.getElementById('status').textContent = d.status; break;
      case 'message.created': bubble(d.messageId, 'user').textContent = d.text; break;
      case 'message.delta': bubble(d.messageId, 'assistant').textContent += d.text; break;
      case 'message.completed': bubble(d.messageId, 'assistant').textContent = d.text; break;
      case 'tool.call': line(`Using ${d.tool}...`, 'note'); break;
      case 'doc.changed': line(`Draft updated (${d.opCount} change(s)).`, 'note'); break;
      case 'proposal.created': proposal(d); break;
      case 'proposal.resolved': line(`Change set ${d.state}.`, 'note'); break;
      case 'checks.result': line(`Checks: ${d.summary.errors} error(s), ${d.summary.warnings} warning(s).`, 'note'); break;
      case 'draft.ready': line('The draft is ready for your review. Nothing is published until you publish it.', 'note'); break;
      case 'run.failed': line(`The run stopped: ${d.code}.`, 'note'); break;
      default: break;
    }
  }

  // The whole transport: short requests, resumed from the last cursor. Works
  // behind Cloudflare because no request lives longer than ~25 seconds.
  async function poll() {
    let delay = 500;
    for (;;) {
      try {
        const page = await api('GET', `/events?after=${cursor}&wait=20`);
        page.events.forEach(apply);
        cursor = page.cursor;
        delay = 500;
      } catch (error) {
        if (error.status === 403 || error.status === 404) { line(`Stopped polling: ${error.message}`, 'note'); return; }
        await new Promise((resolve) => setTimeout(resolve, delay));
        delay = Math.min(delay * 2, 15000);
      }
    }
  }

  document.getElementById('composer').addEventListener('submit', async (event) => {
    event.preventDefault();
    const input = document.getElementById('text');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    try { await api('POST', '/messages', { text }); } catch (error) { line(`Not sent: ${error.message}`, 'note'); }
  });
  document.getElementById('stop').addEventListener('click', () => api('POST', '/stop', {}).catch(() => {}));

  poll();
</script>
</body>
</html>
